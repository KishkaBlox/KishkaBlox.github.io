# Сайт KishkaBlox на GitHub Pages: сторінка входу + гра в браузері.
# Збирається з тих самих файлів, що й застосунок (blox_game/), тому окремо нічого копіювати не треба.
# Один раз: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Сайт KishkaBlox (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'blox_game/**'
      - 'web/**'
      - 'Assets/Kishkablox.png'
      - 'Assets/Realistic_cars.jpg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Зібрати сайт
        run: node web/build-site.js --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
